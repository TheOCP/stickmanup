<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<!-- Only the game's own scripts ever run, whatever a stranger manages to get onto the page. The hash is the import map below: change it with that. -->
<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'sha256-h3X2WaB2J+hFSH2sz6AdmmoW4he9GKva9VKrMRwkO4s='; object-src 'none'; base-uri 'none'">
<title>StickManUp</title>
<meta name="description" content="A co op climbing game: stickmen tied together by a glowing cord.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StickManUp">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#03060a">
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "./lib/three.module.js", "three/addons/": "./lib/addons/" } }</script>
<script src="js/compat.js"></script>
<script src="lib/peerjs.min.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="fx"></div>

<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <div id="btns">
    <button class="tb" id="bReel"><i class="ring"></i><span>REEL</span></button>
    <button class="tb" id="bGrab"><i class="ring"></i><span>GRAB</span></button>
    <button class="tb big" id="bJump"><span>JUMP</span></button>
    <button class="tb act" id="bAct"><span>GRAPPLE</span></button>
    <button class="tb" id="bShoot"><i class="sight"></i><span>SHOOT</span></button>
    <button class="tb" id="bShield"><i class="ring"></i><span>SHIELD</span></button>
    <button class="tb" id="bDash"><i class="ring"></i><span>DASH</span></button>
  </div>
  <div id="mouseHint">Click to use the mouse</div>
  <div id="editBar"><b>Drag the buttons where you want them</b><button data-e="reset">Reset</button><button data-e="done" class="pri">Done</button></div>
</div>

<div id="hud">
  <button class="hb" id="hPause" aria-label="Pause"><i></i><i></i></button>
  <div id="hZone"><b></b><span></span></div>
  <div id="hTime"></div>
  <div id="hWatch"></div>
  <div id="hCoins"></div>
  <div id="hAlt"><div class="track"></div><div class="marks"></div></div>
  <div id="hWarn"></div>
  <div id="hPlayers"></div>
  <button class="hb" id="hEmote" aria-label="Emotes"><span>😀</span></button>
  <div id="fpsArea"><div id="hFps"></div></div>
  <div id="cross"><i></i></div>
</div>
<div id="emoteMenu"></div>
<div id="tipMarks"></div>
<div id="tipCard"><b>Tip</b><p></p></div>
<div id="tags"></div>
<div id="zoneTitle"><small></small><h2></h2><p></p></div>
<div id="toasts"></div>
<div id="menu"></div>
<div id="padHint"></div>
<div id="rotate"><b>Turn your phone sideways to play</b></div>
<div id="loading"><div class="logo">STICKMAN<span>UP</span></div><p>Building the world...</p></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
